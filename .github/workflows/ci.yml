name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:  # a newer push to the same branch or PR replaces a running check
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Unit tests and lint only: live tests (marked live / live_slow) need a signed-in Google
    # session and are deselected by pytest's addopts.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: uv run ruff check src tests
      - run: uv run pytest -q
