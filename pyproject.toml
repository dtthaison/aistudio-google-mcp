[project]
name = "aistudio-py"
version = "0.2.0"
description = "Unofficial CLI that automates the Google AI Studio web app and Google Flow"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Son Doan" }]
keywords = ["google-ai-studio", "google-flow", "gemini", "veo", "cli"]
dependencies = [
  "click>=8.2",
  "httpx>=0.27",
  "rich>=13",
  "filelock>=3.13",
  "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/dtthaison/aistudio-google-mcp"
Issues = "https://github.com/dtthaison/aistudio-google-mcp/issues"

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = [
  "playwright>=1.45",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.13",
  "pre-commit>=4",
  "types-pyyaml>=6",
]

[project.scripts]
aistudio = "aistudio.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aistudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not live and not live_slow' --import-mode=importlib"
markers = [
  "live: hits the real AI Studio service (opt-in)",
  "live_slow: slow live tests such as video and music (opt-in)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# S: bandit's security rules. An exception carries "# noqa: S... (reason)" on its own line.
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest asserts; fake credentials and a plain `git ls-files` are the point of some tests
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
